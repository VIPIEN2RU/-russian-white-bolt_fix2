name: "🔄 Auto-update VPN Configs"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Europe/Moscow
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-configs:
    name: "📥 Fetch & Update VPN Configs"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📂 Checkout from GitHub"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: "🔑 Add GitVerse remote"
        run: |
          git remote add gitverse https://RUVIPIEN:${{ secrets.PUSH_TK }}@gitverse.ru/RUVIPIEN/russian-white-bolt_fix.git

      - name: "🐍 Setup Python"
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.10"

      - name: "📦 Install dependencies"
        run: pip install requests beautifulsoup4 lxml

      - name: "📁 Prepare directories"
        run: |
          mkdir -p configs sources scripts

      - name: "🌐 Fetch VPN configs"
        run: python scripts/fetch_configs.py

      - name: "📝 Generate README"
        run: python scripts/generate_readme.py

      - name: "🌐 Generate index.html"
        run: python scripts/site.py

      - name: "📊 Count files"
        id: count
        run: |
          VPN_FILES=$(find configs -type f ! -name "metadata.json" 2>/dev/null | wc -l)
          echo "vpn_files=$VPN_FILES" >> $GITHUB_OUTPUT

      - name: "💾 Commit and push to both remotes"
        run: |
          git config user.name "gitverse-bot"
          git config user.email "bot@gitverse.ru"
          git add -A
          git diff --cached --quiet || git commit -m "🔄 Auto-update: $(date)"
          git push origin HEAD
          git push gitverse HEAD || echo "GitVerse push failed"

  deploy-vercel:
    name: "🚀 Deploy to Vercel"
    runs-on: ubuntu-latest
    needs: update-configs
    if: always() && needs.update-configs.result == 'success'
    
    steps:
      - name: "📂 Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: "📦 Install Vercel CLI"
        run: npm install -g vercel

      - name: "🚀 Deploy to Vercel (first time)"
        run: |
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --name VPNBOLT \
            --yes
