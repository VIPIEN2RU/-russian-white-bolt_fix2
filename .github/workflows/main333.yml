name: Unzip and Push

on:
  push:
    branches: [ main ]

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # SHA для v3

      - name: Unzip to root
        run: |
          unzip -o russian-white-bolt_fix-RUVIPIEN-patch.zip
          rm -f russian-white-bolt_fix-RUVIPIEN-patch.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract files from zip" || echo "No changes to commit"
          git push
