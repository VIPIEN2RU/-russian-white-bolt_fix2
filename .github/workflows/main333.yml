name: Unzip and Push4444

on:
  push:
    branches: [ main ]

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Unzip to root
        run: |
          # Распаковываем zip прямо в корень
          unzip -o russian-white-bolt_fix-RUVIPIEN-patch.zip
          
          # Удаляем сам zip (опционально)
          rm -f russian-white-bolt_fix-RUVIPIEN-patch.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract files from zip" || echo "No changes to commit"
          git push
